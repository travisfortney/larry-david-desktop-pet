name: Validate package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate package
        run: make test

      - name: Validate web package
        run: make test-web
