name: Secret checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified secret scanner
        shell: bash
        run: |
          set -euo pipefail
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          archive="$temporary/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$temporary" gitleaks
          install -m 755 "$temporary/gitleaks" "$RUNNER_TEMP/gitleaks"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan commit changes for secrets
        shell: bash
        env:
          BEFORE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          report=$(mktemp)
          output=$(mktemp)
          trap 'rm -f "$report" "$output"' EXIT
          revision=HEAD
          if [[ -n "$BEFORE_REVISION" && ! "$BEFORE_REVISION" =~ ^0+$ ]]; then
            if [[ ! "$BEFORE_REVISION" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_REVISION" =~ ^[0-9a-f]{64}$ ]]; then
              echo 'Secret scan could not resolve the base revision.' >&2
              exit 2
            fi
            if ! git cat-file -e "$BEFORE_REVISION^{commit}" 2>/dev/null; then
              echo 'Secret scan is missing base history.' >&2
              exit 2
            fi
            revision="$BEFORE_REVISION..HEAD"
          fi
          status=0
          gitleaks git . --log-opts="-m --full-history --no-ext-diff --no-textconv --no-renames $revision" \
            --redact=100 --no-banner --no-color --log-level error --timeout 60 \
            --report-format json --report-path "$report" >"$output" 2>&1 || status=$?
          if ((status == 1)); then
            python3 - "$report" <<'PY'
          import json
          import sys
          try:
              findings = json.load(open(sys.argv[1]))
              if not isinstance(findings, list) or not findings:
                  raise ValueError()
              print("Potential secrets in commit changes; values omitted:", file=sys.stderr)
              for finding in findings[:20]:
                  print(json.dumps({key: finding.get(key) for key in
                                    ("File", "StartLine", "RuleID", "Commit")}), file=sys.stderr)
          except (OSError, ValueError, TypeError, AttributeError):
              print("Secret scanner returned an unusable report.", file=sys.stderr)
              sys.exit(2)
          PY
          elif ((status != 0)); then
            echo 'Secret scanner could not complete; check failed without printing scanner output.' >&2
          fi
          exit "$status"
